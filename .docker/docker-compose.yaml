# Example command:
#   on a NVIDIA system:
#   docker compose run gpu
#   without discrete graphics:
#   docker compose run cpu

services:
  cpu:
    build: 
      context: ..
      dockerfile: .docker/Dockerfile
    image: denso_ros:humble
    privileged: true
    network_mode: host
    command: /bin/bash
    volumes:
      - ../:/root/denso_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
  gpu:
    build: 
      context: ..
      dockerfile: .docker/Dockerfile
    image: denso_ros:humble
    privileged: true
    network_mode: host
    command: /bin/bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../:/root/denso_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all